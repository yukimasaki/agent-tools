name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      # Validate each plugin directory as well: validating the repository root
      # only checks the marketplace manifest, not the skills' frontmatter.
      - name: Validate each plugin
        run: |
          status=0
          for dir in plugins/*/; do
            [ -f "$dir/.claude-plugin/plugin.json" ] || continue
            echo "::group::$dir"
            claude plugin validate "./$dir" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install pyyaml
          sudo apt-get update && sudo apt-get install -y jq

      - name: Check shell syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || status=1
          done < <(find plugins tests -name '*.sh' -print0)
          exit "$status"

      - name: Check Python syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || status=1
          done < <(find plugins -path '*/scripts/*' -type f -print0 | xargs -0 grep -lZ '^#!.*python' || true)
          exit "$status"

      - name: Run tests
        run: |
          status=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
